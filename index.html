<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>💗</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #ffe6f0, #f4d9ff);
      overflow: hidden;
    }

    .container {
      text-align: center;
      background: rgba(255, 255, 255, 0.85);
      padding: 40px 30px;
      border-radius: 25px;
      width: 90%;
      max-width: 500px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    }

    .heart {
      font-size: 60px;
      animation: heartbeat 1.2s infinite;
    }

    h1 {
      color: #d45a91;
      margin: 15px 0;
    }

    p {
      color: #777;
      font-size: 18px;
    }

    .buttons {
      position: relative;
      height: 180px;
      margin-top: 20px;
    }

    button {
      border: none;
      border-radius: 30px;
      font-size: 18px;
      cursor: pointer;
      transition: all 0.3s ease;
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
    }

    #yesBtn {
      background: #e889ad;
      color: white;
      padding: 14px 28px;
      left: 15%;
      z-index: 10;
    }

    #noBtn {
      background: #ddd;
      color: #555;
      padding: 14px 28px;
      left: 55%;
      z-index: 5;
    }

    #yesBtn:hover {
      transform: translateY(-50%) scale(1.1);
    }

    .message {
      display: none;
      animation: appear 0.6s ease;
    }

    .message h2 {
      color: #d45a91;
      font-size: 30px;
    }

    @keyframes heartbeat {
      0%, 100% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.15);
      }
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: scale(0.7);
      }

      to {
        opacity: 1;
        transform: scale(1);
      }
    }
  </style>
</head>

<body>

  <div class="container" id="questionBox">

    <div class="heart">💨</div>

    <h1>pwede ba akong mag vape?</h1>
    <p>pretty pweseee...</p>

    <div class="buttons">
      <button id="yesBtn">Yes 💗</button>
      <button id="noBtn">No 😭</button>
    </div>

  </div>

  <div class="container message" id="thankYou">

    <div class="heart">💜</div>

    <h2>Thank youuu! 🥹💗</h2>

    <p>
      I knew it! hehe.<br>
      THANK YOUUU
    </p>

  </div>


  <script>

    const yesBtn = document.getElementById("yesBtn");
    const noBtn = document.getElementById("noBtn");

    const questionBox = document.getElementById("questionBox");
    const thankYou = document.getElementById("thankYou");

    let noSize = 18;

    noBtn.addEventListener("click", function() {

      // Make NO bigger
      noSize += 8;

      noBtn.style.fontSize = noSize + "px";
      noBtn.style.padding =
        (noSize * 0.6) + "px " +
        (noSize * 1.2) + "px";

      // Keep YES visible
      yesBtn.style.left = "5%";

      // Move NO to the right
      noBtn.style.left = "55%";

      // Change text
      const messages = [
        "No 😭",
        "Are you sure? 🥺",
        "Really? 😭",
        "Think again! 🥹",
        "Pleaseee 😭",
        "Last chance! 💔",
        "NOOO 😭"
      ];

      let index = Math.min(
        Math.floor((noSize - 18) / 8),
        messages.length - 1
      );

      noBtn.textContent = messages[index];

    });


    yesBtn.addEventListener("click", function() {

      questionBox.style.display = "none";
      thankYou.style.display = "block";

    });

  </script>

</body>
</html>
